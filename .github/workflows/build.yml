name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set environments
        run: |
          repo="$(echo ${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/})"
          version="$(grep versionName app/build.gradle | awk -F\" '{print $2}')"
          commit="$(echo ${{ github.sha }} | cut -c-7)"
          {
            echo "repo=${repo}"
            echo "version=v${version}"
            echo "commit=${commit}"
            echo "artifact=${repo}-${version}@${commit}"
          } >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          ./gradlew assembleDebug
          cp -f app/build/outputs/apk/debug/app-debug.apk ${{ env.artifact }}.apk

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ env.artifact }}.apk
